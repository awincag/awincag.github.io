{% assign client = include.client %}
<div class="client-logo">
  {% if client.logo %}<img src="{{ client.logo | relative_url }}" alt="{{ client.alt | escape }}">{% endif %}
</div>
<span class="cs-title nh-d-65">{{ client.name | escape }}</span>
<div class="p-action nh-t-55">
  <p>{{ client.description }}</p>
</div>
